[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-evaluation-harness"
version = "0.1.0"
description = "A reusable, deterministic-first evaluation harness for RAG and LLM systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pranay Eligeti" }]
keywords = ["evaluation", "rag", "llm", "retrieval", "metrics", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# The deterministic evaluation path depends on pydantic only. TOML parsing uses
# the standard library `tomllib`; the CLI uses the standard library `argparse`.
# No HTTP client, no model-provider SDK: `ai-eval run` never touches the network.
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ai-eval = "ai_eval_harness.cli.main:run_cli"

[project.urls]
Homepage = "https://github.com/pranay-eligeti/ai-evaluation-harness"
Source = "https://github.com/pranay-eligeti/ai-evaluation-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_eval_harness"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RET", # return
    "ARG", # unused arguments
    "PTH", # prefer pathlib
    "TID", # tidy imports
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct partially-valid payloads and use long literals.
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
# Test helpers construct intentionally invalid payloads to exercise validation.
disallow_untyped_decorators = false
