name: Evaluation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: python -m pytest
      - name: Build and install the base wheel in isolation
        run: |
          python -m pip wheel --no-deps . --wheel-dir scratch/wheels
          python -m venv scratch/wheel-env
          scratch/wheel-env/bin/python -m pip install scratch/wheels/*.whl
          scratch/wheel-env/bin/ai-eval --help
          scratch/wheel-env/bin/ai-eval run --capture examples/rag/baseline.json --config examples/rag/suite.toml --report scratch/wheel-report.json
      - name: Install optional provider SDKs
        run: python -m pip install -e ".[providers]"
      - name: Exercise real SDKs using offline HTTP transports
        run: python -m pytest tests/providers/test_sdk_transport.py
      - run: ai-eval --help
      - run: ai-eval run --dataset examples/datasets/synthetic.json --config examples/suite.toml --report scratch/passing.json
      - name: Offline semantic suite
        run: ai-eval run --dataset examples/datasets/synthetic.json --config examples/semantic-offline.toml --report scratch/semantic.json
      - name: Verify deliberate gate failure
        shell: bash
        run: |
          set +e
          ai-eval run --dataset examples/datasets/synthetic.json --config examples/failing.toml --report scratch/failing.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify report contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from ai_eval_harness.runner import SuiteReport
          for name, status in (("passing", "passed"), ("failing", "failed"), ("semantic", "passed")):
              report = SuiteReport.model_validate_json(Path(f"scratch/{name}.json").read_text())
              assert report.status == status
              if name == "semantic":
                  assert all(result.kind.value == "llm_judge" for result in report.results)
                  assert all(result.metadata["prompt_version"] == "2" for result in report.results)
          PY
      - name: Offline RAG capture evaluation
        run: |
          ai-eval run --capture examples/rag/baseline.json --config examples/rag/suite.toml --report scratch/baseline.json
          ai-eval run --capture examples/rag/candidate.json --config examples/rag/suite.toml --report scratch/candidate.json
      - name: Passing regression comparison
        run: ai-eval compare --baseline scratch/baseline.json --candidate scratch/candidate.json --config examples/rag/regression-pass.toml --report scratch/comparison.json
      - name: Offline semantic provenance comparison
        run: ai-eval compare --baseline scratch/semantic.json --candidate scratch/semantic.json --config examples/rag/semantic-regression.toml --report scratch/semantic-comparison.json
      - name: Deliberate regression failure
        shell: bash
        run: |
          set +e
          ai-eval compare --baseline scratch/baseline.json --candidate scratch/candidate.json --config examples/rag/regression-fail.toml --report scratch/regression-failed.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Validate capture and comparison contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from ai_eval_harness.capture import load_capture
          from ai_eval_harness.comparison_models import ComparisonReport
          for name in ("baseline", "candidate"):
              load_capture(Path(f"examples/rag/{name}.json"))
          for name, status in (("comparison", "passed"), ("regression-failed", "failed")):
              report = ComparisonReport.model_validate_json(Path(f"scratch/{name}.json").read_text())
              assert report.status == status
              assert report.population.matched_count == 3
              assert {c.metrics["recall@1"].status for c in report.cases} == {"improved", "regressed", "unchanged"}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: scratch/*.json
