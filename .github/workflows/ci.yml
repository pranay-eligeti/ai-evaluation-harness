name: Evaluation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: python -m pytest
      - name: Install optional provider SDKs
        run: python -m pip install -e ".[providers]"
      - name: Exercise real SDKs using offline HTTP transports
        run: python -m pytest tests/providers/test_sdk_transport.py
      - run: ai-eval --help
      - run: ai-eval run --dataset examples/datasets/synthetic.json --config examples/suite.toml --report scratch/passing.json
      - name: Offline semantic suite
        run: ai-eval run --dataset examples/datasets/synthetic.json --config examples/semantic-offline.toml --report scratch/semantic.json
      - name: Verify deliberate gate failure
        shell: bash
        run: |
          set +e
          ai-eval run --dataset examples/datasets/synthetic.json --config examples/failing.toml --report scratch/failing.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify report contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from ai_eval_harness.runner import SuiteReport
          for name, status in (("passing", "passed"), ("failing", "failed"), ("semantic", "passed")):
              report = SuiteReport.model_validate_json(Path(f"scratch/{name}.json").read_text())
              assert report.status == status
              if name == "semantic":
                  assert all(result.kind.value == "llm_judge" for result in report.results)
                  assert all(result.metadata["prompt_version"] == "2" for result in report.results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: scratch/*.json
