# Replace model with an account-accessible model supporting native JSON schema outputs.
[judge]
provider = "openai"
model = "YOUR_OPENAI_MODEL"
timeout = 30.0
max_retries = 1
retry_delay = 1.0
max_output_tokens = 1024
prompt_version = "2"
[[evaluators]]
type = "llm_judge_answer_relevance"
[[evaluators]]
type = "llm_judge_groundedness"
[[gates]]
evaluator = "llm_judge_answer_relevance"
min_mean_score = 0.8
[[gates]]
evaluator = "llm_judge_groundedness"
min_mean_score = 0.66
max_skipped_count = 2
